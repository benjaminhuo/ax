{{- if .Values.server.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ax.clusterRoleName" . }}
  labels:
    {{- include "ax.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ax.clusterRoleName" . }}
  labels:
    {{- include "ax.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ax.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ax.clusterRoleName" . }}
{{- end }}
