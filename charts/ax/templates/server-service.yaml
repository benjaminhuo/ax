apiVersion: v1
kind: Service
metadata:
  name: {{ include "ax.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ax.labels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      appProtocol: kubernetes.io/h2c
  selector:
    {{- include "ax.serverSelectorLabels" . | nindent 4 }}
