{{- if .Values.substrate.networkPolicy.create }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ax.apiPolicyName" . }}
  namespace: {{ .Values.substrate.namespace }}
  labels:
    {{- include "ax.labels" . | nindent 4 }}
spec:
  podSelector:
    {{- toYaml .Values.substrate.networkPolicy.apiPodSelector | nindent 4 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "ax.serverSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.substrate.apiPort }}
{{- end }}
