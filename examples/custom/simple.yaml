# The smallest useful Task: no Workspace or Model.
#
# The task runs on the image pinned below with an empty
# /workspace directory.
#
#   ax apply -f examples/custom/simple.yaml
#   ax describe task simple-task
#   ax ssh simple-task -- ls -la /workspace
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: simple-task
  atespace: default
spec:
  image: "docker.io/benjaminhuo/ax-task-runner@sha256:51a08a6574f572a16fa70ea66fc8419bac336f81016e539524e401cfb3deebb8"
  env:
    - name: ENVIRONMENT
      value: "test"
  debug: true # serve guest services so `ax ssh` works; off by default
